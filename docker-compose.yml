version: "3.9"

services:
  backend:
    build: ./backend
    container_name: gemobnb-api
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: gemobnb-web
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped